_schema-version: 3.3.0
ID: DispatcherService
version: 1.0.0
description: "Dispatcher service for handling dispatch operations."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: DispatcherService-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      []
      # - name: DispatcherService-db

  # - name: DispatcherService-db-deployer
