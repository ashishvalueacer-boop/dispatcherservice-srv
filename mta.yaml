_schema-version: 3.3.0
ID: DispatcherService
version: 0.1.0
# Version 0.1.0 (24 September 26) - Added functionality to save simulated Freight Order updates through a new service.Created a function SaveFOSAP
# Version 0.0.9 (21 September 26) - Added Parameter for GetDrv and GetRes and GetBuilkInfo - StartTime and EndTime and DC
# Version 0.0.8 (21 September 26) - Added Parameter for GetDrv and GetRes - StartTime and EndTime
# Version 0.0.7 (21 September 26) - Added destination for GetFOSimilution to Resolve issue of Internal Server error. 
# Version 0.0.6 (17 September 26) - Added function for GetFOSimilution
# Version 0.0.5 - Removed Parameter for Start Date and End Date
description: "Dispatcher service for handling dispatch operations."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: DispatcherService-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack     
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: DispatcherService-auth
      - name: Destination_Driver_Assignment_destination
resources:
  - name: DispatcherService-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: DispatcherService_v1
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: Destination_Driver_Assignment_destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
